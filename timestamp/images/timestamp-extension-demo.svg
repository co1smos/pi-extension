<svg xmlns="http://www.w3.org/2000/svg" width="776" height="440" viewBox="0 0 776 440" role="img" aria-labelledby="title desc"><title id="title">Offline timestamp extension mechanism demonstration</title><desc id="desc">Captured Pi 1.3.0 native component rows in an isolated synthetic extension harness. Both timestamps are above messages. Host spacing is preserved. Not a full terminal screenshot or an installed product.</desc><rect width="776" height="440" fill="#171b1d"/><g font-family="DejaVu Sans Mono, monospace"><text x="28" y="32" font-size="18" fill="#dee0e1">Pi 1.3.0 · extension mechanism proof</text><text x="28" y="61" font-size="14" fill="#a798d7">OFFLINE · SYNTHETIC · NOT INSTALLED</text><text x="28" y="85" font-size="12" fill="#9da5a9">Actual native component rows · 80 columns · host spacing retained</text><text xml:space="preserve" x="28" y="150" font-size="15" fill="#dee0e1" textLength="9" lengthAdjust="spacingAndGlyphs"> </text><text xml:space="preserve" x="37" y="150" font-size="15" fill="#7e888e" textLength="261" lengthAdjust="spacingAndGlyphs">2026-10-22 11:32:05 UTC-07:00</text><text xml:space="preserve" x="298" y="150" font-size="15" fill="#dee0e1" textLength="450" lengthAdjust="spacingAndGlyphs">                                                  </text><rect x="28" y="180" width="720" height="24" fill="#213b49"/><text xml:space="preserve" x="28" y="198" font-size="15" fill="#dee0e1" textLength="720" lengthAdjust="spacingAndGlyphs">                                                                                </text><rect x="28" y="204" width="9" height="24" fill="#213b49"/><text xml:space="preserve" x="28" y="222" font-size="15" fill="#dee0e1" textLength="9" lengthAdjust="spacingAndGlyphs"> </text><rect x="37" y="204" width="405" height="24" fill="#213b49"/><text xml:space="preserve" x="37" y="222" font-size="15" fill="#dee0e1" textLength="405" lengthAdjust="spacingAndGlyphs">Please show the timestamp above each message.</text><rect x="442" y="204" width="306" height="24" fill="#213b49"/><text xml:space="preserve" x="442" y="222" font-size="15" fill="#dee0e1" textLength="306" lengthAdjust="spacingAndGlyphs">                                  </text><rect x="28" y="228" width="720" height="24" fill="#213b49"/><text xml:space="preserve" x="28" y="246" font-size="15" fill="#dee0e1" textLength="720" lengthAdjust="spacingAndGlyphs">                                                                                </text><text xml:space="preserve" x="28" y="294" font-size="15" fill="#dee0e1" textLength="9" lengthAdjust="spacingAndGlyphs"> </text><text xml:space="preserve" x="37" y="294" font-size="15" fill="#7e888e" textLength="261" lengthAdjust="spacingAndGlyphs">2026-10-22 11:32:09 UTC-07:00</text><text xml:space="preserve" x="298" y="294" font-size="15" fill="#dee0e1" textLength="450" lengthAdjust="spacingAndGlyphs">                                                  </text><text xml:space="preserve" x="28" y="342" font-size="15" fill="#dee0e1" textLength="720" lengthAdjust="spacingAndGlyphs"> Each timestamp stays above its message.                                        </text><text x="28" y="404" font-size="12" fill="#9da5a9">Local zone: America/Los_Angeles · no provider calls</text><text x="28" y="424" font-size="12" fill="#9da5a9">Replay equals live rows; timestamps excluded from model context.</text></g></svg>
