<svg xmlns="http://www.w3.org/2000/svg" width="520" height="700" viewBox="0 0 520 700" role="img" aria-labelledby="title desc"><title id="title">Proposed timestamps above user and assistant messages</title><desc id="desc">Synthetic conversation. Pi dark-theme tokens. Proposed layout illustration, not an installed extension screenshot. Supported custom-entry mechanism separately demonstrated offline. Narrow wrapping.</desc><g font-family="DejaVu Sans Mono, monospace"><rect x="0" y="0" width="520" height="700" fill="#171b1d"/><rect x="0" y="0" width="520" height="48" fill="#252a2d"/><text x="24" y="31" fill="#dee0e1" font-size="16">pi · timestamp / proposed layout</text><text x="24" y="80" fill="#a798d7" font-size="13">PROPOSED · SYNTHETIC · NOT IMPLEMENTED</text><text x="24" y="124" fill="#7e888e" font-size="17">2026-10-22 11:32:05</text><text x="24" y="148" fill="#7e888e" font-size="17">UTC-07:00</text><rect x="14" y="160" width="492" height="50" fill="#213b49"/><text x="24" y="186" fill="#dee0e1" font-size="18">Summarize the release notes.</text><text x="24" y="234" fill="#7e888e" font-size="17">2026-10-22 11:32:09</text><text x="24" y="258" fill="#7e888e" font-size="17">UTC-07:00</text><text x="24" y="296" fill="#dee0e1" font-size="18">Three changes stand out:</text><text x="24" y="322" fill="#dee0e1" font-size="18">• Faster startup</text><text x="24" y="348" fill="#dee0e1" font-size="18">• Clearer error messages</text><text x="24" y="374" fill="#dee0e1" font-size="18">• Smaller package size</text><text x="24" y="422" fill="#7e888e" font-size="17">2026-10-22 11:33:12</text><text x="24" y="446" fill="#7e888e" font-size="17">UTC-07:00</text><rect x="14" y="458" width="492" height="50" fill="#213b49"/><text x="24" y="484" fill="#dee0e1" font-size="18">Keep the summary brief.</text><text x="24" y="532" fill="#7e888e" font-size="17">2026-10-22 11:33:14</text><text x="24" y="556" fill="#7e888e" font-size="17">UTC-07:00</text><text x="24" y="594" fill="#dee0e1" font-size="18">Startup is faster; errors are clearer;</text><text x="24" y="620" fill="#dee0e1" font-size="18">the package is smaller.</text><rect x="14" y="656" width="492" height="1" fill="#768186"/><text x="24" y="683" fill="#9da5a9" font-size="14">Display zone: America/Los_Angeles</text></g></svg>
